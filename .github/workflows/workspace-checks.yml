name: Workspace checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/new-workspace-v4]
jobs:
  syntax-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test