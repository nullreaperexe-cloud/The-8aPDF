name: Workspace checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/new-workspace-v4]
permissions:
  contents: read
jobs:
  syntax-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test