name: EduSecure Holiday Calendar Sync

on:
  workflow_dispatch:
  schedule:
    # 18:30 UTC = 00:00 Asia/Kolkata the following calendar day.
    # GitHub schedules are best-effort and can start late.
    - cron: '30 18 * * *'

permissions:
  contents: write

concurrency:
  group: edusecure-holiday-calendar-sync
  cancel-in-progress: false

jobs:
  daily-holiday-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out The-8aPDF
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install browser automation dependency
        run: python -m pip install selenium==4.36.0

      - name: Test holiday parsing and calendar safety
        run: python -m unittest discover -s tests -p 'test_edusecure_holidays.py' -v

      - name: Read EduSecure holiday banner and update calendar
        env:
          EDUSECURE_USERNAME: ${{ secrets.EDUSECURE_USERNAME }}
          EDUSECURE_PASSWORD: ${{ secrets.EDUSECURE_PASSWORD }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/edusecure_holiday_sync.py

      - name: Commit only verified holiday calendar changes
        run: |
          if git diff --quiet -- data/school-calendar.json; then
            echo "Calendar is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/school-calendar.json
          git commit -m "Update school holidays from EduSecure banner"
          git push origin HEAD:main
