name: Train AI Finder (Groq Metadata)

on:
  workflow_dispatch:
  schedule:
    # 19:30 UTC = 01:00 India time next day; GitHub may start late.
    - cron: '30 19 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/train-ai-finder.py'
      - 'tests/ai-finder-quality.test.cjs'
      - '.github/workflows/train-ai-finder.yml'

permissions:
  contents: write

concurrency:
  group: 8apdf-groq-finder-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify search ranking and training script
        run: |
          python -m py_compile scripts/train-ai-finder.py
          node tests/ai-finder-quality.test.cjs

      - name: Offline metadata enrichment using Groq
        if: github.event_name != 'push'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing GROQ_API_KEY GitHub Actions secret; old training index remains available."
            exit 0
          fi
          python scripts/train-ai-finder.py

      - name: Publish refreshed search index
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/ai-finder-training.json; then
            echo "Training metadata unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-finder-training.json
          git commit -m "Refresh offline Groq search metadata for PDFs and announcements"
          git pull --rebase origin main
          git push origin HEAD:main
