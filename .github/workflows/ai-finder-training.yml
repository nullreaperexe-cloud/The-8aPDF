name: Train AI Finder Search Keywords (Groq)

on:
  workflow_dispatch:
  schedule:
    # 19:30 UTC = 01:00 AM Asia/Kolkata
    - cron: '30 19 * * *'

permissions:
  contents: write

concurrency:
  group: groq-ai-finder-training
  cancel-in-progress: false

jobs:
  enrich-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate offline trainer
        run: |
          node --check scripts/ai-finder-train.mjs
          node tests/ai-finder-quality.test.cjs
      - name: Enrich published PDFs and announcements with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_FINDER_SITE: https://8apdf.me
        run: node scripts/ai-finder-train.mjs
      - name: Commit updated training metadata only
        run: |
          if git diff --quiet -- data/ai-finder-training.json; then
            echo "Keyword index already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-finder-training.json
          git commit -m "Refresh AI Finder Groq keyword enrichment"
          git push origin HEAD:main
