name: Install original 8aPDF background music

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '8apdf-four-original-bg-tracks.zip'
      - '.github/workflows/install-bgm-tracks.yml'

permissions:
  contents: write

concurrency:
  group: 8apdf-music-install
  cancel-in-progress: false

jobs:
  install-original-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: true

      - name: Verify and install unmodified MP3 files
        run: |
          if [ ! -f 8apdf-four-original-bg-tracks.zip ]; then
            echo "Audio ZIP already installed; nothing to extract."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256

          archive = Path('8apdf-four-original-bg-tracks.zip')
          checksums = {
              'assets/bgm/tum-hi-ho.mp3': '944f6e5a467242a0f1f918883dbd71211d86bde2451a8b9e2425dcff921cda66',
              'assets/bgm/meri-duniya-tu-hi-re.mp3': 'd813a7ccced98c9b42f60ee39e5cae1ace1b9775fc6308162dff0951f75725c4',
              'assets/bgm/khairiyat.mp3': 'adc6dd69f44e409d711bf8fdcf6ea27312e6d437279eefe3e9bde87d21fd3b19',
              'assets/bgm/saiyaara.mp3': '95ed77d1a7e69e16db25341671df698be2104cd307a503055dac22e0168f0b8c',
          }

          with ZipFile(archive) as package:
              if set(package.namelist()) != set(checksums):
                  raise ValueError('Unexpected archive layout. Use the exact 8aPDF music ZIP.')
              contents = {}
              for name, expected in checksums.items():
                  contents[name] = package.read(name)
                  if sha256(contents[name]).hexdigest() != expected:
                      raise ValueError('MP3 checksum mismatch: ' + name)

          for name, original in contents.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(original)
              assert sha256(target.read_bytes()).hexdigest() == checksums[name]

          # Only delete the previous working audio AFTER all four originals pass verification.
          Path('assets/8apdf-background-music.mp3').unlink(missing_ok=True)
          archive.unlink()
          print('PASS: installed all four original-quality MP3 files and removed the old audio.')
          PY

      - name: Commit finished music library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install four verified MP3 tracks and remove old background music"
            git push origin HEAD:main
          fi
