name: Monochrome Music Library Checks
on:
  push:
    branches: [feature/monochrome-music-library-20261101]
  pull_request:
    paths:
      - "music-library/**"
      - "drive-music.js"
      - "drive-music.css"
      - "bgm-howler.js"
      - "api/music-search.js"
      - "tests/drive-music.test.cjs"
jobs:
  music-library:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check drive-music.js
          node --check bgm-howler.js
          node --check api/music-search.js
          for file in music-library/*.js; do node --check "$file"; done
      - name: Music integration and playback regression tests
        run: |
          node tests/drive-music.test.cjs
          node tests/bg-music-playlist.test.cjs
          node tests/music-download.test.js
          node tests/music-choice.test.cjs
