<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio & videos</title>
<style>
audio, video {
display: block;
margin: 20px auto;
border: 2px solid #333;
border-radius: 5px;
}
</style>
</head>
<body>
<div>
 <h3>Listen to Audio</h3>
 <audio controls><source src="School Song.mp3" type="audio/mpeg"> School
Song</audio>
</div>
<div>
 <h3>Watch the Video</h3>
<video width="320" height="240" controls>
<source src="Sample.mp4" type="video/mp4">
Sample video </video>
</div>
</body> </html>
