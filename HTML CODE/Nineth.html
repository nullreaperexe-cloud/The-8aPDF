<!DOCTYPE html>
<html lang="en">
<head>
<title>Div with Background Examples</title>
<style>
.a{
background-color: #3E424B; /* Dark gray background color */
background-size: cover; /* Ensure the image covers the entire div */
height: 200px; /* Set height to visualise the background better */
width: 100%; /* Full width of the container */
text-align: center; /* Center the text */
color: #FFF6EA; /* Light creme text color */
padding: 20px; /* Inner space between the content and the edge of the div */
}
.b{
background-color: #FFF6EA; /* Light creme background color */
background-image: url('logo-modified.png'); /* Background image */
background-size: contain;/* Scales the logo to fit without clipping */
background-repeat:no-repeat;/* Prevents the logo from tiling */
background-position: left; /* Center the background image */
height: 200px; /* Set height to visualise the background better */
width: 100%; /* Full width of the container */
text-align: center; /* Center the text */
color: #3E424B; /* Dark gray text color */
padding: 20px; /* Inner space between the content and the edge of the div */
}
</style>
</head>
<body>
<div class="a">
This is a div element with a background color.
</div>
<div class="b">
This is a div element with a centered background image.
</div>
</body>
</html>
