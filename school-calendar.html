<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Calendar · 8aPDF</title><script>if(parent===window)location.replace('/school-calendar');</script><link rel="stylesheet" href="/pdf-explorer.css"><style>.calendar-main{max-width:1050px;margin:auto;padding:28px 20px}.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 15px}.calendar-toolbar button{padding:10px 15px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calendar-grid>span{color:var(--muted);font-size:12px;text-align:center;padding:5px}.calendar-date{border:1px solid var(--line);background:var(--surface);color:var(--text);min-height:82px;padding:12px 9px;border-radius:12px;display:grid;gap:4px;text-align:left}.calendar-date small{color:var(--muted);font-size:11px}.calendar-date.off{background:var(--bg-alt);opacity:.65}.calendar-date.today{border-color:var(--text)}.calendar-date.faded{opacity:.4}.calendar-summary{margin:14px 0;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.calendar-summary p{margin:5px 0;font-size:13px}.holiday-editor{margin-top:25px;border-top:1px solid var(--line);padding-top:20px}.holiday-editor label{display:block;font-size:12px;margin-bottom:5px}.holiday-editor input{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);min-width:0;max-width:100%;width:100%}.holiday-editor form{display:grid;grid-template-columns:1fr 1fr 2fr auto;align-items:end;gap:10px}.holiday-editor button{padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--button);color:var(--button-text)}.my-holiday{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid var(--line);font-size:12px}.calendar-note{color:var(--muted);font-size:12px}.calendar-selection{min-height:65px;color:var(--text-soft);padding:15px 0;font-size:13px}@media(max-width:600px){.calendar-main{padding:20px 12px}.calendar-grid{gap:4px}.calendar-date{min-height:63px;padding:8px 5px;border-radius:9px;font-size:12px}.calendar-date small{font-size:9px}.holiday-editor form{grid-template-columns:1fr 1fr}.holiday-editor form>label:nth-child(3){grid-column:1/-1}.calendar-toolbar h2{font-size:18px}}</style><script defer src="/tool-theme.js"></script><script defer src="/school-calendar-view.js"></script><link rel="stylesheet" href="/site-unified-font.css?v=unified-20261030-v1">
</head><body><main class="calendar-main"><h1>School cycle calendar</h1><p class="calendar-note">Sunday and 2nd/4th Saturday are off. School holidays pause the six-day cycle.</p><section id="calendarSummary" class="calendar-summary" aria-label="Today's school day">Loading school calendar…</section><div class="calendar-toolbar"><button id="calendarPrevious" aria-label="Previous month">←</button><h2 id="calendarMonth"></h2><button id="calendarNext" aria-label="Next month">→</button></div><div id="calendarGrid" class="calendar-grid"></div><p id="calendarSelection" class="calendar-selection" role="status">Select a date to inspect its school day.</p><p class="calendar-note" id="calendarSources"></p><section class="holiday-editor"><h2>My extra school holidays</h2><p class="calendar-note">Use confirmed school dates. These extra entries stay saved on this device.</p><form id="calendarHolidayForm"><label>From<input type="date" id="calendarHolidayStart" required></label><label>To<input type="date" id="calendarHolidayEnd" required></label><label>Holiday name<input id="calendarHolidayReason" maxlength="80" placeholder="e.g. School vacation"></label><button type="submit">Add holiday</button></form><div id="calendarMyHolidays"></div></section></main></body></html>
